name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  GSETTINGS_BACKEND: memory

jobs:
  scope:
    name: Select inference checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      inference: ${{ steps.scope.outputs.inference }}
      search: ${{ steps.scope.outputs.search }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci-scope.py
  packaging:
    name: Release contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  native:
    needs: scope
    name: GNOME 51 / ${{ matrix.platform.distro }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.platform.image }}
      options: --privileged
    timeout-minutes: 45
    env:
      GSK_RENDERER: cairo
      GSEEK_TEST_SHELL: '1'
      GSEEK_TEST_BACKEND: cpu
      GSEEK_TEST_MODEL_CACHE: ${{ github.workspace }}/.ci-data/gseek/models
      GSEEK_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
      GSEEK_GUI_TEST_COMMAND: cargo test --lib ui::tests::native_views -- --ignored --test-threads=1
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-cache
      GSEEK_TEST_RUNTIME_CACHE: ${{ github.workspace }}/.ci-data/gseek/runtimes
      GSEEK_INFERENCE_TIMEOUT: '300'
    # The shared Flatpak platform checks CPU and Vulkan below on both architectures.
    # Native jobs cover readers, recovery, search, and GTK on each target distro.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { distro: ubuntu-26.10, image: 'ubuntu:26.10' }
          - { distro: fedora-45, image: 'fedora:45' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: bash scripts/ci-deps.sh
      - name: Install pinned Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup.sh
          bash /tmp/rustup.sh -y --profile minimal --default-toolchain 1.99.0 --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          gnome-shell --version | tee gnome-version.txt
          gnome-shell --version | grep -E '^GNOME Shell 51\.'
          pkg-config --modversion gtk4 libadwaita-1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ${{ needs.scope.outputs.search == 'true' && '.ci-data/gseek' || '' }}
          key: native-${{ matrix.platform.distro }}-${{ needs.scope.outputs.search == 'true' && 'cpu' || 'build' }}-${{ hashFiles('Cargo.lock', 'data/runtimes.json') }}
          restore-keys: native-${{ matrix.platform.distro }}-${{ needs.scope.outputs.search == 'true' && 'cpu' || 'build' }}-
      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and contract tests
        run: |
          cargo test --locked --all-targets
          cargo test --locked --no-default-features --lib
          cargo build --locked
      - name: Prepare integration fixture
        if: needs.scope.outputs.search == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$XDG_CONFIG_HOME/gseek" artifacts
          printf '{"backend":"%s"}\n' cpu > "$XDG_CONFIG_HOME/gseek/settings.json"
      - name: Test real embeddings and backend recovery
        if: needs.scope.outputs.inference == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test real_inference -- --ignored --test-threads=1 2>&1 | tee artifacts/inference.log
          cargo test --locked --lib inference::tests::worker_restarts_after_process_failure -- --ignored --test-threads=1 2>&1 | tee artifacts/recovery.log
      - name: Test search, D-Bus, and native GTK
        if: needs.scope.outputs.search == 'true'
        env:
          GSETTINGS_BACKEND: keyfile
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a bash tests/run-e2e.sh 2>&1 | tee artifacts/e2e.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.platform.distro }}-cpu
          path: |
            artifacts/
            gnome-version.txt
          if-no-files-found: warn

  installed:
    needs: [scope, flatpak]
    if: needs.scope.outputs.search == 'true'
    name: Installed Flatpak / ${{ matrix.platform.distro }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.platform.image }}
      options: --privileged
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { distro: ubuntu-26.10, image: 'ubuntu:26.10' }
          - { distro: fedora-45, image: 'fedora:45' }
    env:
      GSK_RENDERER: cairo
      GSETTINGS_BACKEND: keyfile
      GSEEK_TEST_SHELL: '1'
      GSEEK_TEST_BACKEND: cpu
      GSEEK_TEST_MODEL_CACHE: ${{ github.workspace }}/.ci-data/gseek/models
      GSEEK_TEST_RUNTIME_CACHE: ${{ github.workspace }}/.ci-data/gseek/runtimes
      GSEEK_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/screenshots
      XDG_DATA_HOME: ${{ github.workspace }}/.ci-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
      XDG_CACHE_HOME: ${{ github.workspace }}/.ci-cache
      GSEEK_INFERENCE_TIMEOUT: '300'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GNOME test dependencies
        run: bash scripts/ci-deps.sh
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-data/gseek
          key: installed-${{ matrix.platform.distro }}-${{ hashFiles('data/runtimes.json') }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-x86_64
          path: artifacts/package
      - name: Test installed Flatpak in GNOME Activities
        env:
          GSETTINGS_BACKEND: keyfile
          GSEEK_TEST_FLATPAK: '1'
          GSEEK_GUI_TEST_COMMAND: ''
          GSEEK_TEST_UPDATE_REPO: ${{ github.workspace }}/artifacts/flatpak-repo
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home --uid 1001 gseek-ci
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
          chown -R gseek-ci:gseek-ci "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" artifacts
          runuser -u gseek-ci -- bash -c '
            set -euo pipefail
            flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
            ostree --repo=artifacts/flatpak-repo init --mode=archive-z2
            flatpak build-import-bundle artifacts/flatpak-repo artifacts/package/gseek-x86_64.flatpak
            flatpak build-update-repo artifacts/flatpak-repo
            flatpak remote-add --user --no-gpg-verify gseek-ci "$PWD/artifacts/flatpak-repo"
            flatpak install --user --noninteractive -y gseek-ci com.fariszr.gseek
            xvfb-run -a bash tests/run-e2e.sh 2>&1 | tee artifacts/flatpak-e2e.log
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-evidence-${{ matrix.platform.distro }}
          path: artifacts/
          if-no-files-found: warn

  flatpak:
    needs: scope
    name: Flatpak / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils appstream librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder
            .flatpak-inference
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('build-aux/*.json', 'Cargo.lock') }}
          restore-keys: flatpak-${{ matrix.arch }}-
      - name: Build and install the sandboxed app
        run: |
          flatpak-builder --assumeyes --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build build-aux/com.fariszr.gseek.json
          flatpak --user remote-add --if-not-exists --no-gpg-verify gseek-ci "$PWD/flatpak-repo"
          flatpak --user install --or-update -y --noninteractive gseek-ci com.fariszr.gseek
          test "$(flatpak info --user --show-commit com.fariszr.gseek)" = "$(ostree --repo=flatpak-repo rev-parse app/com.fariszr.gseek/${{ matrix.arch }}/stable)"
          flatpak build-bundle flatpak-repo gseek-${{ matrix.arch }}.flatpak com.fariszr.gseek stable
      - name: Check packaged readers, libraries, and model inference
        env:
          GSEEK_TEST_INFERENCE: ${{ needs.scope.outputs.inference }}
        run: bash tests/flatpak-smoke.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: gseek-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          compression-level: 0
