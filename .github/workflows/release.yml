name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    name: Check release state
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$REF_TYPE" == tag ]]; then test "$REF_NAME" = "v$version"; fi
          published=$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$published" == false ]]; then
            echo "Version $version is already published; keeping its verified assets."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: inspect
    if: needs.inspect.outputs.build == 'true'
    name: Flatpak release / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils appstream librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder
            .flatpak-inference
          key: flatpak-${{ matrix.arch }}-${{ hashFiles('build-aux/*.json', 'Cargo.lock') }}
          restore-keys: flatpak-${{ matrix.arch }}-
      - name: Build and test exact release deployment
        env:
          GSEEK_TEST_INFERENCE: 'true'
        run: |
          flatpak-builder --assumeyes --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build build-aux/com.fariszr.gseek.json
          flatpak --user remote-add --if-not-exists --no-gpg-verify gseek-ci "$PWD/flatpak-repo"
          flatpak --user install --or-update -y --noninteractive gseek-ci com.fariszr.gseek
          test "$(flatpak info --user --show-commit com.fariszr.gseek)" = "$(ostree --repo=flatpak-repo rev-parse app/com.fariszr.gseek/${{ matrix.arch }}/stable)"
          bash tests/flatpak-smoke.sh
          flatpak build-bundle flatpak-repo gseek-${{ matrix.arch }}.flatpak com.fariszr.gseek stable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: gseek-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          compression-level: 0
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Publish verified Flatpak bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          (cd release && sha256sum gseek-*.flatpak > SHA256SUMS)
          gh release create "v$version" release/* --target "$GITHUB_SHA" --title "GSeek $version" --generate-notes
