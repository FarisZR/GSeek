name: GPU runtime builds
on:
  pull_request:
    paths: ['inference/**', 'scripts/build-inference.sh', 'scripts/package-runtime.py', '.github/workflows/gpu.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.backend }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            arch: x86_64
            os: ubuntu-24.04
            image: nvidia/cuda:13.4.2-devel-ubuntu24.04@sha256:7005688f5eaa5a9aaa9e555f546107c4454446a543347fd48b0bdb63ea027ad2
          - backend: cuda
            arch: aarch64
            os: ubuntu-24.04-arm
            image: nvidia/cuda:13.4.2-devel-ubuntu24.04@sha256:7005688f5eaa5a9aaa9e555f546107c4454446a543347fd48b0bdb63ea027ad2
          - backend: rocm
            arch: x86_64
            os: ubuntu-24.04
            image: rocm/dev-ubuntu-24.04:10.1.0-full@sha256:5ed1362ea542a928651e4c710b44024ebe98870f74159cb70f0265aec8ef0abe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Make room for the GPU SDK on this disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build
          key: gpu-${{ matrix.backend }}-${{ matrix.arch }}-${{ hashFiles('inference/**', 'scripts/build-inference.sh', '.github/workflows/gpu.yml') }}
          restore-keys: gpu-${{ matrix.backend }}-${{ matrix.arch }}-
      - name: Compile and package the pinned helper
        env:
          IMAGE: ${{ matrix.image }}
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e BACKEND -e ARCH "$IMAGE" bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends git cmake ninja-build python3 patchelf clang
            git config --global --add safe.directory "*"
            export PATH=/opt/rocm/bin:/usr/local/cuda/bin:$PATH
            export LD_LIBRARY_PATH=/opt/rocm/lib:/opt/rocm/lib64:/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}
            export CUDA_ARCHS="75;120"
            export BUILD_JOBS=2
            bash scripts/build-inference.sh "$BACKEND"
            python3 scripts/package-runtime.py "$BACKEND" "$ARCH"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.backend }}-${{ matrix.arch }}
          path: dist/gseek-runtime-${{ matrix.backend }}-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
